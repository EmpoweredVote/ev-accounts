name: CI

# 💰 THIS REPO IS PRIVATE, SO EVERY JOB IN THIS FILE IS BILLED, AND BILLED WITH A ONE-MINUTE MINIMUM
# PER JOB — not per run, and not by actual seconds used. ev-accounts IS the org's Actions bill: 523 of
# the 524 private-repo runs in the 30 days to 2026-08-26 were this repo.
#
# Measured over those 30 days (429 push, 65 PR, 27 schedule) at the per-event job times observed
# 08-18..26: ~4,300 billed minutes against a 2,000-minute free allowance, so ~2,300 minutes of overage,
# about $18/month. Where it goes:
#
#   ~40%  the four live-DB jobs, run on EVERY ONE of 429 pushes (4 min x 429)
#   ~34%  `migration numbering` + `answer-delete context guards` + `cal-access predicate tripwire`,
#         which each finish in 10-20 SECONDS and each bill a full minute, on all 494 push/PR runs
#   ~23%  `backend` (the only job doing a minute's worth of real work)
#   ~ 3%  the nightly schedule
#
# 🔑 TWO THINGS FOLLOW, AND NEITHER IS "CUT THE NIGHTLY". The nightly is 3% of the bill and is the only
# drift coverage on a day with no code push; cutting it trades real coverage for pocket change. The
# money is in per-push repetition: a job that costs a minute because of the MINIMUM costs it 494 times
# a month, and a drift check whose own rationale is that data changes ON THE CALENDAR (see the
# `schedule` note below) is charged per commit instead. Know both numbers before adding a tenth job.
#
# WHERE IT STANDS AFTER THE TWO FIXES BELOW (paths-ignore, plus `child-county` and
# `readrank-question-unit` moved to schedule-only): ~2,800 minutes a month, ~800 over the allowance,
# about $6/month. Down from ~$18.
#
# 🔴 THE TWO CHECKS THAT STAYED ON PUSH DID SO ON EVIDENCE, NOT ON HABIT — do not "finish the job" by
# moving them too. Over the 90 days to 2026-08-26, `address-search reachability` accounts for EVERY ONE
# of the 34 genuine live-DB failures, and three of them were open for 7, 7 and 15 minutes: 08-11 15:25,
# and 08-19 01:24 and 01:49, each closed by the very next commit (`fix(ci): unbreak address-search
# reachability`, `fix(ci): BAD_GEOMETRY must key on SPATIAL reachability`). A four-times-a-day schedule
# samples a 7-minute window with about a 2% chance. These checks are not a drift monitor; they are a
# feedback loop that works because the author is still at the keyboard. `stance sourcing` stays for the
# same reason at a longer range: research campaigns are the fastest sessions in this repo — the NC pass
# was ~20 pushes in one night writing 234 rows — and nightly-only would mean hearing about a bad
# citation batch after all of it is written.
on:
  # 📄 Docs-only changes do not run CI. Of 90 push/PR runs in the 8 days above, 18 (20%) changed
  # nothing but markdown or `.planning/` artefacts. No check in this file reads a .md file — the
  # guards scan .sql and .ts, the rest query the live database — so those 18 runs could only ever
  # come back green.
  #
  # GitHub skips a run only when EVERY changed path matches, so a commit touching one .ts file and
  # forty .md files still runs the full set. A docs-only push to master also skips the four live-DB
  # drift jobs for that push; the nightly schedule below still covers them that day.
  #
  # 🔴 DO NOT ADD SOURCE DIRECTORIES HERE. `docs/infra/**` is CDK TypeScript, not documentation. It is
  # in the clear today only because `**/*.md` does not match it — ignoring `docs/**` wholesale would
  # silently exempt real code the day someone wires a check to it. (No YAML anchor to share this list:
  # GitHub Actions does not expand aliases in workflow files.)
  pull_request:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - '.planning/**'
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - '.planning/**'
  # The live-DB jobs (`reachability`, `child-county`, `stance-sources`, `readrank-question-unit`) also
  # run on a schedule: their
  # data drifts on its own — terms start and end, boundary loads land, research passes write rows —
  # with no commit to trigger anything. 13:00 UTC = ~06:00 US/Pacific, after the 06:00 UTC FEC ingest
  # window.
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

# One run per event per ref; a newer push cancels the run it supersedes.
#
# ⚠ THIS SAVES NOTHING TODAY. Over the same 8 days, ZERO of 100 runs overlapped a newer run on the
# same ref — the whole workflow finishes in about two minutes and pushes land minutes apart. It is
# here as a ratchet, not a saving: it costs nothing to hold and starts paying the day a job gets slow
# or two commits land inside a minute. Do not cite it as the fix for the Actions bill; the bill is the
# per-job minimum above.
#
# Cancelling is safe on master, not only on PRs, because every static check here scans the WORKING
# TREE (the migrations directory, one .ts file) rather than diffing against the previous commit, so
# the surviving run still covers whatever the cancelled one would have seen. The live-DB jobs want the
# newest run by definition.
#
# 🔑 `github.event_name` IS IN THE GROUP KEY ON PURPOSE. Push and schedule share `refs/heads/master`.
# Without the event in the key, the 13:00 nightly could cancel an in-flight push run — and the nightly
# does not run `backend`, the numbering check, the delete guards or the tripwire, so those four checks
# would go unreported for that commit with nothing saying so.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# 🔑 ONE INDEPENDENT DATA CHECK PER JOB — with two deliberate exceptions, one of them guarded. A
# failing step masks every step after it in the same job, and the masked check reports "skipped"
# nowhere a human is looking — the job is just red for the first reason. That cost two days on
# 2026-08-14: a stale matview failed ahead of the stance check, which therefore never ran, hiding an
# ORPHAN_CONTEXT regression through 19 red runs. So the LIVE-DB checks each keep their own job: jobs
# run in parallel, the only price of splitting is a duplicated `npm ci`, and similar subject matter is
# NOT a reason to couple failure reporting. If you add a check that talks to the database, give it its
# own job.
#
# EXCEPTION 1 — `static guards`: the four dependency-free static checks (no `npm ci` at all, each ~10-20s)
# are merged into one job so they pay the one-minute-per-job MINIMUM once instead of four times. They
# each fail for a DIFFERENT reason, so the masking trap is real — and it is defused MECHANICALLY, not
# waved away: every check step there carries `if: ${{ !cancelled() }}`, so each one RUNS and reports
# its own pass/fail even after an earlier step has failed. Nothing is skipped behind a red step, so the
# 2026-08-14 failure cannot recur; the only thing given up is four status-check NAMES collapsing into
# one, with each guard still visible as a step. A new guard added there MUST be dependency-free and
# carry the same `if:` — otherwise it belongs in its own job.
#
# EXCEPTION 2 — `backend`: lint → typecheck → test is one pipeline over one commit, where the run order
# IS the fix order, so it deliberately stops on the first failure.
jobs:
  backend:
    name: backend lint · typecheck · test
    runs-on: ubuntu-latest
    # Skipped on the nightly schedule: no commit means no new code to lint, and the scheduled run
    # exists only for the live-DB jobs below.
    if: github.event_name != 'schedule'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Read the pin rather than repeating it. CI on 22 while backend/.node-version
          # said 20 is what hid the @supabase/supabase-js WebSocket break until production
          # boot (2026-08-28). The two must not be able to drift again.
          node-version-file: backend/.node-version
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Unit tests only. Integration tests (../tests/**) need a live database
      # and secrets; run those separately, not on every PR.
      #
      # 🔴 THE FILTER USED TO BE `src scripts/check-`, WHICH RAN NOTHING UNDER scripts/lib/ AT
      # ALL. vitest positional arguments are substring filters on the file path, so every test
      # in that directory was silently outside CI — including the steward's own: the allocator
      # seeder, the slot parser and the ref scanner were merged with tests that had never once
      # been run by this job. Found on 2026-09-04 by adding 18 tests and watching the count stay
      # at 1,038. Widening it to `scripts` picked up 11 files and 198 tests, and cost about a
      # third of a second.
      #
      # 🔴 ONE FILE IS EXCLUDED BY NAME, AND IT IS EXCLUDED BECAUSE IT NEEDS A DATABASE.
      # `ingest-gazetteer-places-counties.test.ts` imports src/lib/db.ts, which imports
      # src/lib/env.ts, which THROWS at import time when DATABASE_URL is absent. It passed on
      # the author's machine (a local .env) and failed here on the first run — CI has no .env, so
      # the file collapses before a single test runs. It was outside `test:unit` before this
      # widening too, so excluding it keeps the baseline: the change is purely additive.
      # Giving it a live database belongs with the `../tests/**` integration suite, not here.
      #
      # ⚠ A TEST OUTSIDE CI IS NOT A TEST, AND IT LOOKS EXACTLY LIKE ONE. There is nothing in a
      # green run that says which files it chose, which is why this went unnoticed. If you narrow
      # this filter again, say what it excludes and why — as the line above does.
      - name: Unit tests
        run: npm run test:unit

  static-guards:
    name: static guards
    runs-on: ubuntu-latest
    # 💰 THE FOUR CHEAP STATIC GUARDS, MERGED to pay the one-minute-per-job MINIMUM once instead of four
    # times. Each is dependency-free (it runs straight off node, NO `npm ci`) and finishes in 10-20
    # SECONDS, yet each billed a full minute as its own job — ~34% of the Actions bill for work that
    # takes seconds. Folding them into one job saves ~1,050 billed minutes a month. The members were the
    # separate jobs `migration numbering`, `answer-delete context guards`, `cal-access predicate
    # tripwire` and `office occupancy (ADR 0002)`; each is now a STEP below, keeping its own name.
    #
    # 🔴 THE MASKING TRAP IS DEFUSED, NOT ACCEPTED. These four fail for genuinely DIFFERENT reasons — a
    # duplicate migration number, an answer deleted without a context decision, a re-enabled broken
    # predicate, a read of the dropped politician_id column — so under GitHub's default
    # stop-on-first-failure a red early step would hide the checks after it. That is exactly the defect
    # that cost two days on 2026-08-14. Every CHECK step below therefore carries `if: ${{ !cancelled() }}`:
    # it RUNS and reports its own pass/fail even after an earlier step has already failed. The job is red
    # if ANY guard fails, and each guard's real status shows on its own step — nothing is skipped behind
    # a red step. If you add a fifth guard here it MUST be dependency-free and carry the same `if:`;
    # otherwise give it its own job.
    #
    # TRIGGER is the UNION of the four originals: push + PR. Three ran on push+PR already. `office
    # occupancy` was PR-only; on a push its base resolves to origin/master (== HEAD after the push), so
    # it scans an empty diff and is a harmless no-op there — full coverage on PRs, unchanged. `fetch-depth:
    # 0` is the superset the numbering and occupancy diffs need; harmless for the other two.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      # fetch-depth: 0 so the base branch is available to the numbering and occupancy diffs.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          # Read the pin rather than repeating it. CI on 22 while backend/.node-version
          # said 20 is what hid the @supabase/supabase-js WebSocket break until production
          # boot (2026-08-28). The two must not be able to drift again.
          node-version-file: backend/.node-version

      # --- migration numbering ---------------------------------------------------------------------
      # Scans the migrations directory for duplicate numbers outright (meaningful on any event) and, on
      # a PR, also diffs files added on the branch against the base. Was PR-only until 2026-08-10, when
      # two parallel DIRECT PUSHES to master both took 1681 with no PR between them and CI never ran. On
      # a push there is no base_ref; BASE_REF is left unset and the script resolves origin/master
      # itself, or falls back to the tree scan alone. Dependency-free.
      - name: migration numbering
        if: ${{ !cancelled() }}
        run: node backend/scripts/check-migration-numbers.mjs
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}

      # --- frozen ladder text ----------------------------------------------------------------------
      # CA_0012 froze compass_topics/compass_stances' TEXT columns when content versioning came in
      # (ADR 0004); the live wording is in compass_stance_revisions, keyed by the topic_revision_id a
      # SEASON pins. Measured 2026-09-08: 29 of the 60 topics in the open season disagree with the
      # frozen text, 16 of them on ALL FIVE RUNGS. The frozen table returns a complete, plausible
      # five-rung ladder on the right subject — for `housing` the QUESTION TEXT is even identical — so
      # a query that reads it neither errors nor looks wrong. A stance pass that day read it for six
      # topics and briefly concluded five PUBLISHED rows were mis-seated. Voter read paths were never
      # affected; this guards research and reporting queries, which is where it happened. Baseline is
      # generated (--update-baseline), fails only on a RISE, and must never be raised to pass.
      # Static, no DATABASE_URL, dependency-free.
      - name: frozen ladder text
        if: ${{ !cancelled() }}
        run: node backend/scripts/check-ladder-text-reads.mjs

      # --- suppressed-answer reads -----------------------------------------------------------------
      # CC_0062 put answer suppression in `inform.compass_responses_effective`; eleven reads in
      # backend/src had to switch to it. A twelfth read reaching for `compass_responses_current` out of
      # habit is INVISIBLE IN REVIEW: until the season changeover the two views return byte-identical
      # rows, so it compiles, passes its tests, and only starts showing somebody a stance on a rung
      # they never chose once a season opens. Six of the eleven were PostgREST builder calls, which a
      # SQL-text scan cannot see at all — the same blind spot #349 found in the season gate. Static, no
      # DATABASE_URL, dependency-free.
      - name: suppressed-answer reads
        if: ${{ !cancelled() }}
        working-directory: backend
        run: node scripts/check-suppressed-answer-reads.mjs

      # --- auth client isolation -------------------------------------------------------------------
      # A session-establishing GoTrue call (signInWithPassword, signUp, refreshSession, verifyOtp, ...)
      # on a shared DATA client leaves that user's session on the singleton; supabase-js then sends the
      # user's token on every later .rpc()/.from() instead of the API key, so the shared client stops
      # authenticating as service_role. That is the 2026-09-10 compass-write outage (PR #453): every
      # adminRpc() after a login ran as `authenticated` and was denied EXECUTE on the write RPCs. The
      # one-word wrong-client is invisible in review and only bites at runtime after a login. Static, no
      # DATABASE_URL, dependency-free.
      - name: auth client isolation
        if: ${{ !cancelled() }}
        working-directory: backend
        run: node scripts/check-auth-client-isolation.mjs

      # --- answer-delete context guards ------------------------------------------------------------
      # Between 2026-08-12 and 08-13, SEVEN passes deleted stance answers and left the reasoning behind
      # (1735, 1738, 1739 and the four Maryland passes), silently creating ORPHAN_CONTEXT violations —
      # the gate went 50 -> 224 and CI stayed red for 19 runs. This is a LINT on the change ("whoever
      # removed an answer thought about the context"), NOT an FK: 404 rows are context-without-answer by
      # design (documented blanks). Static, no DATABASE_URL, so it runs on forks too.
      - name: answer-delete context guards
        if: ${{ !cancelled() }}
        run: node backend/scripts/check-answer-delete-guards.mjs

      # --- cal-access predicate tripwire -----------------------------------------------------------
      # `confirm-cal-access.ts` matches Cal-Access committees on the LAST SPACE-DELIMITED TOKEN of
      # full_name, ignoring last_name: "Gracey Van Der Mark" -> "mark" claims 391 committees. It is
      # inert only by ACCIDENT (migration 1463 dropped the column it joins on, so it throws), and
      # repairing that join is a one-line change that would re-run the defect at full scale. A RATCHET:
      # it fails only on the single combination that re-creates the defect, and tests code with comments
      # stripped so the tripwire's own quoted rule does not jam it shut. Static, runs on forks.
      - name: cal-access predicate tripwire
        if: ${{ !cancelled() }}
        run: node backend/scripts/check-cal-access-predicate.mjs

      # --- office occupancy (ADR 0002) -------------------------------------------------------------
      # essentials.offices.politician_id was dropped (ADR 0002 phase 5), so referencing it is a runtime
      # 42703 undefined_column. This catches it in the diff instead. BASE_REF is empty on push (the
      # script falls back to origin/master and scans an empty diff), origin/<base> on a PR.
      # Dependency-free.
      - name: office occupancy (ADR 0002)
        if: ${{ !cancelled() }}
        run: node backend/scripts/check-office-occupancy.mjs
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}

      # --- postgis spatial_ref_sys guard (ev-cto decision 0006) ------------------------------------
      # PostGIS sits in `public`, which we cannot change (the extension is owned by supabase_admin), so
      # `anon` holds an un-revocable write grant on public.spatial_ref_sys. Decision 0006 ACCEPTS that
      # only because nothing load-bearing reads the table: the live district lookups pin SRID 4326 and
      # use ST_SetSRID + ST_Covers/ST_Contains, none of which touch it. Two patterns break that premise —
      # `ST_Transform` and a `::geography` cast, both of which read spatial_ref_sys — so this fails the
      # build if either enters backend/src, supabase/migrations or backend/migrations. Two historical
      # one-shot area casts in backend/migrations are grandfathered by the script; comments are blanked
      # before matching, so the pointer comments that NAME these patterns do not trip it. Reintroducing
      # either in live SQL re-opens decision 0006 and needs sign-off. Static, no DATABASE_URL,
      # dependency-free — so it belongs here and carries the same `if:` as its neighbours.
      - name: postgis spatial_ref_sys guard
        if: ${{ !cancelled() }}
        run: node backend/scripts/check-postgis-spatial-ref-guard.mjs

      # --- OCD-ID loader suffix guard --------------------------------------------------------------
      # `parseInt('01A', 10)` is 1. A loader deriving a state-legislative OCD-ID suffix that way drops
      # the subdistrict letter, so 1A/1B/1C collapse onto `.../sldl:1`. It happened twice: Minnesota
      # (caught in a dry run, 2026-09-12) and Maryland, which shipped 84 damaged rows across TWO tables
      # before CC_0113 repaired them on 2026-09-16. ND (slice 12) and SD (slice 15) have the same shape
      # and are not loaded yet.
      #
      # NOTHING ELSE IN CI CAN SEE IT: `ocd_id` has no unique constraint so duplicates write silently,
      # and address search resolves on `geo_id`, so reachability and every identity anchor stay green.
      # What it corrupts is arithmetic — federalCoverage's seat denominator read 94 for a state with 118.
      #
      # This step is the STATIC half: it asserts the sldu/sldl branch of load-state-tiger-boundaries.ts
      # still derives its suffix via ocdDistrictSuffix() and has not gone back to parseInt. It is scoped
      # to that branch on purpose — the `cd` branch's parseInt is CORRECT, because congressional codes
      # are plain numbers, and an earlier draft that scanned the whole file flagged it. The DATA half is
      # the `ocd-suffixes` job below; neither replaces the other, because this one fails on the pull
      # request that would cause a bad load while that one fails after one has run.
      # Static, no DATABASE_URL, dependency-free — so it belongs here and carries the same `if:`.
      - name: OCD-ID loader suffix guard
        if: ${{ !cancelled() }}
        run: node backend/scripts/check-ocd-loader-suffix.mjs

  migration-reservations:
    name: migration reservations
    runs-on: ubuntu-latest
    # 🔴 THIS CANNOT JOIN `static guards`, AND THAT JOB SAYS SO ITSELF: a guard added there must be
    # DEPENDENCY-FREE, because it runs straight off node with no `npm ci`. This one talks to
    # Postgres through `pg`, so it pays its own job minute. Its own job also gives it its own
    # status-check name, which matters more here than for a static lint — a red wall from this
    # check means "go and ask the allocator", and that instruction should not arrive buried in
    # another job's step list.
    #
    # WHY IT EXISTS: check-migration-numbers.mjs scans every ref and names its own blind spot —
    # a number another session has DECIDED to use is invisible until it pushes, so no scan can
    # ever see it. That is the 1681 collision, and on 2026-09-04 two of one author's sessions
    # came within one step of it TWICE with the correct procedure followed both times. The
    # steward closes the hole by making the reservation the observable event; this check is what
    # makes reserving compulsory, since an allocator nobody has to ask is opt-in.
    #
    # ⚠ IT DOES NOT REPLACE THE REF SCAN. That one needs no network and no credentials, so it
    #   works when the steward does not, and it catches anyone who bypassed the steward
    #   altogether. Allocator plus auditor; two independent detectors is what keeps the steward
    #   from becoming a single point of failure. Both stay.
    #
    # SKIPS GREEN without DATABASE_URL (forks get no secrets) and DEGRADES green if the steward
    # is unreachable — a credential rotation must not red-wall every PR in the organisation. Both
    # paths print WHY on stdout, because a check that passes silently is the shape of a detector
    # that has quietly stopped working.
    #
    # 💰 THE PRICE, STATED BECAUSE THIS FILE'S HEADER REQUIRES IT ("Know both numbers before adding
    # a tenth job"). This is the tenth job. It runs on push and PR — ~494 runs a month at the
    # ONE-MINUTE MINIMUM, so ~494 billed minutes, about $4/month at the overage rate the header
    # measures. It finishes in seconds and exits early when no migration was added, but the
    # minimum is per job, not per second, so early exit saves nothing.
    #
    # Two cheaper shapes were considered and rejected. Folding it into `static guards` is
    # forbidden by that job's own rule: a guard there must be dependency-free, and this one needs
    # `pg`. Folding it into `backend` would couple a database check to a lint/typecheck/test
    # pipeline that deliberately stops on first failure — the masking defect that cost two days
    # on 2026-08-14. PR-only would halve it, but 1681 was two DIRECT PUSHES to master with no PR
    # between them and CI never ran, which is why `migration numbering` is push+PR; a slot check
    # that skips direct pushes misses the very event that motivated it.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    defaults:
      run:
        working-directory: backend
    steps:
      # fetch-depth: 0 — the check diffs added files against the merge base, and reads the
      # AUTHOR of the commit that added each one. A shallow clone has neither.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: backend/.node-version
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check every added migration sits in a slot its author reserved
        run: npm run check:reservations -- --verbose
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}

  reachability:
    name: address-search reachability
    runs-on: ubuntu-latest
    # NOT on pull_request. Unlike the two guards above, this one queries the live database rather
    # than the diff — and migrations here are applied ad hoc, never replayed by a deploy (CLAUDE.md),
    # so a PR's SQL has not touched prod yet and there is nothing new for it to see. What it actually
    # guards is PROD DRIFT: terms start and end on their own dates, so a seat can become unreachable
    # with no commit involved. Hence master pushes + the daily schedule.
    if: github.event_name != 'pull_request'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Read the pin rather than repeating it. CI on 22 while backend/.node-version
          # said 20 is what hid the @supabase/supabase-js WebSocket break until production
          # boot (2026-08-28). The two must not be able to drift again.
          node-version-file: backend/.node-version
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Catches the class of defect that shipped three times in migrations 1495/1496/1498 and that
      # essentials.offices_missing_terms cannot see: a seeded officeholder no resident can surface by
      # typing their address. Baselined per state|district_type, so it fires on growth or a new
      # jurisdiction, not on the known backlog.
      #
      # Skips itself (exit 0) when DATABASE_URL is absent — forks get no secrets, and a green skip is
      # better than a red build nobody can fix.
      - name: Check every seeded officeholder is reachable by address
        run: npm run check:reachability
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  child-county:
    name: child→county mapping
    runs-on: ubuntu-latest
    # 🔴 THIS IS THE CHECK THAT DID THE MASKING, so it is the one with the least excuse to share a job.
    # On 2026-08-14 15:34 a stale matview left by the WA TIGER load turned this step red while it was
    # the second step of `address-search reachability`. The stance sourcing check sat AFTER it in the
    # same job and therefore never executed, hiding an ORPHAN_CONTEXT regression that had been red
    # since 08-13. The run log showed only the mapping error.
    #
    # It was kept beside reachability for one more commit on the argument that both are
    # geofence/address concerns "that usually fail for the same underlying reason". That argument is
    # wrong in the way that matters: the two checks failing for the SAME reason costs nothing, and the
    # one time they failed for DIFFERENT reasons is precisely when the masking happened. Similar
    # subject matter is not a reason to couple failure reporting.
    #
    # 💰 SCHEDULE ONLY SINCE 2026-08-26 — NOT ON PUSH. What makes this matview stale is a BOUNDARY
    # LOAD: a script run against the database, which frequently carries no commit at all. Charging the
    # check to all 429 pushes a month bought a minute each time for an event that pushes do not cause.
    #
    # Evidence for the move: across the 90 days to 2026-08-26 this job failed 5 times, all 5 inside the
    # 2026-08-24 19:30-21:17 window in which ALL FOUR live-DB jobs went red together and recovered with
    # no fix commit — a transient database problem, not a mapping defect. Zero genuine push catches
    # since it got its own job on 08-14.
    #
    # ⚠ THE EVIDENCE WINDOW IS 12 DAYS, which is thin. What bounds the risk is the blast radius, not the
    # sample: the failure mode is newly added cities sitting outside their county on the coverage
    # dashboard, the correct value is 0, and the fix is one command. A day of a wrong dashboard is the
    # worst case. If that stops being true — if anything starts READING this matview on a path a user
    # can hit — put it back on push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Read the pin rather than repeating it. CI on 22 while backend/.node-version
          # said 20 is what hid the @supabase/supabase-js WebSocket break until production
          # boot (2026-08-28). The two must not be able to drift again.
          node-version-file: backend/.node-version
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Migration 1696 persisted the child->county spatial assignment into a materialized view, and 52
      # scripts insert into essentials.geofence_boundaries, so there is no single loader to hook a
      # refresh onto. Without this, a boundary load silently leaves newly added cities sitting outside
      # their county on the coverage dashboard until someone happens to look.
      #
      # Zero tolerance, no baseline: the correct value is 0 and the fix is one command.
      #
      # Skips itself (exit 0) without DATABASE_URL, so forks get a green skip.
      - name: Check the persisted child→county mapping is not stale
        run: npm run check:child-county
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  stance-sources:
    name: stance sourcing
    runs-on: ubuntu-latest
    # 🔴 THIS HAD ITS OWN JOB CREATED ON 2026-08-14 BECAUSE SHARING ONE COST TWO DAYS OF BLINDNESS.
    # It used to be the third step of `address-search reachability`. On 2026-08-13 02:53 ORPHAN_CONTEXT
    # went 50 -> 224 and this check went red. From 08-14 15:34 a SECOND, unrelated failure — a stale
    # geofence_child_county matview left by the WA TIGER load — started failing EARLIER IN THE SAME JOB,
    # so this step never executed at all and the run log showed only the mapping error. The stance
    # regression sat unexamined for 19 consecutive red runs, hidden behind a defect that had nothing to
    # do with it.
    #
    # 🔑 A failing early step in a shared job MASKS every check after it, and the masked check does not
    # report "skipped" anywhere a human is looking — the job is simply red for the first reason. Two
    # data checks that can fail for unrelated reasons should not share a job, however similar their
    # setup: sharing optimises for a few seconds of `npm ci` and pays for it in diagnosis.
    #
    # Same triggers and same prod-drift reasoning as `reachability` — NOT on pull_request, because
    # migrations here are applied ad hoc and never replayed by a deploy, so a PR's SQL has not touched
    # prod yet. What this guards is the corpus as it actually stands.
    if: github.event_name != 'pull_request'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Read the pin rather than repeating it. CI on 22 while backend/.node-version
          # said 20 is what hid the @supabase/supabase-js WebSocket break until production
          # boot (2026-08-28). The two must not be able to drift again.
          node-version-file: backend/.node-version
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Migrations 1494, 1507 and 1508 retired 1,157 stance answers whose only citation was a
      # Ballotpedia bio that does not contain the claim. Nothing in the repo prevented writing them, so
      # without this gate the backlog regenerates on the next research wave. Baselined per state at 596
      # (the known Workstream A backlog) so it fires on growth or a new state, not on the debt.
      #
      # It reads the SHAPE of `sources`, never the cited page — a green run means "no row cites
      # Ballotpedia and nothing else", not "stances are sourced". Content needs a fetch and is the
      # article-body test's job.
      #
      # ONE PARTIAL EXCEPTION since 2026-08-05: FABRICATED_SOURCE (zero-tolerance) does concern whether a
      # cited page exists, but it cannot decide that here — it matches a denylist of URLs and hosts
      # already proven absent (backend/data/fabricated-sources.json). Discovery needs a fetch plus an
      # archive probe with a period control, which archive.org rate-limits, so it runs on demand via
      # `npm run sweep:fabricated-articles` and NOT in CI. Six migrations' worth of fabricated citations
      # (1539, 1540, 1548, 1558, 1562) passed this step green while they were live; the check stops what
      # was confirmed from coming back, it does not prove none exists.
      #
      # Skips itself (exit 0) when DATABASE_URL is absent, so forks get a green skip rather than a red
      # build they cannot fix.
      - name: Check stance sourcing — no Ballotpedia-only rows, no known-fabricated citations
        run: npm run check:stance-sources
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  answer-seasons:
    name: answer-season consumers
    runs-on: ubuntu-latest
    # Its own job per the rule at the top of this file. It fails for a reason unlike every other
    # check here — a query that forgot a season predicate — so sharing a job would let it mask, or be
    # masked by, something unrelated.
    #
    # 🔴 RUNS ON pull_request, UNLIKE the other live-DB jobs, and the difference is deliberate. This
    # gate is HALF static and half live:
    #   · The static half reads backend/src. What it guards is CODE, which arrives by PR, so a PR is
    #     exactly when it must run. Forks have no secrets and it needs none.
    #   · The live half reads pg_proc for SECURITY DEFINER functions. Without DATABASE_URL it prints
    #     a SKIP naming what went unchecked and exits 0, so a fork gets a green skip instead of a red
    #     build it cannot fix — and the pass line itself says "repo only", so a skipped run cannot be
    #     misread as full coverage.
    # It is also on the nightly schedule: a function body can change in prod with no commit here.
    #
    # 💰 THE NUMBERS, per the rule at the top of this file. This job runs on push,
    # PR and schedule — 429 + 65 + 27 = ~521 runs a month. It finishes in ~18
    # SECONDS and bills a full minute each time, so ~521 billed minutes, about
    # $4/month on top of the ~$6 that remains after the paths-ignore and
    # schedule-only fixes. That is the single largest per-job addition since
    # those fixes, and it was taken deliberately, not by habit:
    #
    #   · PR + push, NOT PR-only, for exactly the reason `migration numbering`
    #     gives above — this repo is worked by DIRECT PUSHES TO MASTER, so a
    #     PR-only guard leaves the hole wide open. A season predicate lost on a
    #     direct push is silent: reads fan out months later with nothing failing.
    #   · Schedule kept because the RPC half is genuine drift coverage. A
    #     SECURITY DEFINER body can change in prod with no commit in this repo,
    #     and 27 runs is ~5% of the job's cost.
    #   · NOT folded into an existing fast job, per the one-check-per-job rule —
    #     that would trade $4 for the masking failure that cost two days on
    #     2026-08-14.
    #
    # If the bill needs cutting again, the honest lever here is the ~18s runtime,
    # not the triggers: the static half re-reads every .ts file under backend/src
    # on every run and could be diffed against the base instead.
    #
    # WHY IT EXISTS. Task 6 of the compass-seasons plan repoints the primary key of
    # inform.politician_answers to (politician_id, topic_id, season_id). After that, a read joined on
    # the bare pair FANS OUT once a second season exists — silently, no error, months later — and a
    # write with ON CONFLICT on the bare pair raises 42P10 immediately. Verified on 2026-08-25 with a
    # scratch-table control. This job is why neither can reach master.
    #
    # ⚠ EXPECTED RED until Task 5 of that plan lands. Tasks 4 and 5 ship on one branch so master
    # never sees it failing. If you are reading this because it is red on master, Task 5 regressed.
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Read the pin rather than repeating it. CI on 22 while backend/.node-version
          # said 20 is what hid the @supabase/supabase-js WebSocket break until production
          # boot (2026-08-28). The two must not be able to drift again.
          node-version-file: backend/.node-version
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # A green run means "no consumer is still keyed on the bare pair". It reads text, not meaning:
      # a query filtering on the WRONG season passes. Do not read it as "seasons are correct".
      - name: Check every answer-table consumer names a season
        run: npm run check:answer-seasons
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  readrank-question-unit:
    name: read & rank question unit
    runs-on: ubuntu-latest
    # Its own job per the rule at the top of this file: it fails for reasons entirely unrelated to
    # the other live-DB checks (an editor's quote selection, not geometry or citations), so sharing a
    # job would let either one mask the other.
    #
    # 💰 SCHEDULE ONLY SINCE 2026-08-26 — NOT ON PUSH, and this one is the clearest case of the four.
    # What it guards is a DATA state AN EDITOR CREATES THROUGH THE ADMIN UI. No commit is involved, so
    # running it per push was checking 429 times a month for something a push cannot cause.
    #
    # Evidence: 5 failures in the 90 days to 2026-08-26, all 5 in the 2026-08-24 transient window where
    # all four live-DB jobs went red together and recovered with no fix commit.
    #
    # Zero tolerance and a tiny surface — exactly one race/topic pair in prod (LA Mayor general,
    # economic-development) can produce a violation at all — so a day's detection latency costs one
    # race rendering one question twice, and only if an editor splits that topic in that window.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Read the pin rather than repeating it. CI on 22 while backend/.node-version
          # said 20 is what hid the @supabase/supabase-js WebSocket break until production
          # boot (2026-08-28). The two must not be able to drift again.
          node-version-file: backend/.node-version
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Migration 1377 made the QUESTION the unit of comparison; one topic can host several. The
      # player path stayed topic-grouped until 2026-08-17, merging two questions onto one card under a
      # nondeterministically-chosen question text. The backend is fixed, but NO CONSTRAINT CAN EXPRESS
      # the remaining invariant: 1820 re-keyed the partial unique index to (politician_id, question_id),
      # which correctly and deliberately permits two questions in one topic to be live.
      #
      # What still breaks is the read-rank CLIENT: it keys race progress by topicKey
      # (`topics[t.topicKey] = {...}`), so two cards sharing a topicKey collide — one question renders
      # twice and the other's quotes never appear. The payload now carries `topics[].key` for the client
      # to group on; until that ships, a split topic must not go live, and this is what says so.
      #
      # Zero tolerance, no baseline: the correct value is 0, and exactly one race/topic pair in prod
      # (LA Mayor general, economic-development) can even produce a violation.
      #
      # Skips itself (exit 0) without DATABASE_URL, so forks get a green skip.
      - name: Check no race/topic serves quotes for more than one question
        run: npm run check:readrank-question-unit
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # 💰 A STEP IN AN EXISTING SCHEDULE-ONLY JOB, NOT A TENTH JOB. This file is
      # already ~800 minutes a month over the allowance and says to know the numbers
      # before adding one; a step here costs seconds on a run that is already paying
      # its minimum. It also has no claim to isolation the way `season corpus floor`
      # does — a masked lens-drift warning costs a stale spoke, not lost answers.
      #
      # `immigration` sat in the Federal Lens from the day Season 2 opened, unasked
      # and unrenderable, and was found by hand on 2026-09-08 rather than by any
      # check. A lens is curated data that a season rollover can invalidate without
      # touching a line of code, which is the definition of what a schedule catches
      # and a push cannot.
      - name: Check curated lenses still hold topics this season asks
        run: npm run check:lens-freshness
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  season-corpus-floor:
    name: season corpus floor
    runs-on: ubuntu-latest
    # Its own job per the rule at the top of this file. It fails for a reason no other live-DB check
    # shares — published compass answers went MISSING — and that is the one failure here that must
    # never be masked by a geometry or citation error ahead of it in a shared job.
    #
    # 💰 SCHEDULE ONLY, and the argument is the same one that moved `readrank-question-unit`, only
    # stronger. What this guards is row COUNT in prod. The three ways it drops are an admin-UI save, an
    # ad-hoc `psql` DELETE, and a hand-applied migration — and migrations here are applied ad hoc,
    # never replayed by a deploy (CLAUDE.md), so a pushed .sql file has not touched prod yet. A commit
    # cannot cause what this measures, so charging it per push would bill 429 minutes a month to watch
    # for something pushes do not do.
    #
    # ⚠ IT FAILS WITHOUT DATABASE_URL INSTEAD OF SKIPPING, deliberately breaking this file's
    # green-skip-for-forks convention. Every other live-DB check still means something when it cannot
    # connect — it has a static half, or its absence is visible in a job that also does other work.
    # This one is a single COUNT: with no connection it measures nothing, and a green "skip" from a
    # tripwire is indistinguishable from a green "the corpus is intact". A source that never runs
    # writes no row, and the failure count then reads healthy forever. Use --allow-skip locally.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Read the pin rather than repeating it. CI on 22 while backend/.node-version
          # said 20 is what hid the @supabase/supabase-js WebSocket break until production
          # boot (2026-08-28). The two must not be able to drift again.
          node-version-file: backend/.node-version
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # A per-topic "Save" posting a single-topic payload to a REPLACE-ALL RPC destroyed 40 of 41
      # answers for one politician. CC_0001 fixed the caller/RPC mismatch, and
      # CC_wip_closed_season_immutable.sql (written and proven, not yet applied — it needs an open
      # season) makes the destructive shape refuse in the database, ad-hoc DELETEs included.
      #
      # This is the third layer, and it covers what neither of those can: A TRIGGER CAN BE DROPPED.
      # A SURVIVING row can be dated — both tables carry created_at and updated_at — but a DELETED
      # one leaves nothing at all, so the corpus size is the only continuous evidence the seasons
      # are whole. (This comment used to say the tables carry NO timestamps. That was wrong, and the
      # script's own header corrected it on 2026-09-01: dating the surviving rows is what isolated
      # the CA_0097 window in minutes.)
      #
      # Floors are committed in the script, per season, and DERIVED from the batches that wrote the
      # rows rather than read off prod: season 1 at 33,022 answers / 33,806 context / 44 questions,
      # season 2 at 2,685 / 2,657 / 60 since it opened 2026-09-04. They are floors, not equalities,
      # so a documented correction that ADDS a row still passes. Raise a floor only deliberately;
      # lowering one to get green is the exact event this exists to report. A live season holding
      # answers that no floor covers now FAILS here — an unmeasured season reads green no matter
      # what happens to it, which is how season 2 spent its first day unprotected.
      - name: Check no season has lost answers
        run: npm run check:season-floor -- --verbose
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  spatial-ref-baseline:
    name: spatial_ref_sys baseline
    runs-on: ubuntu-latest
    # 🔴 ITS OWN JOB PER THE RULE AT THE TOP OF THIS FILE: a check that talks to the database does not
    # share a job (a masked tripwire is exactly the 2026-08-14 defect), and it cannot join `static
    # guards` — that job is dependency-free and this one needs `pg`. It watches public.spatial_ref_sys
    # for tampering: `anon` holds INSERT/UPDATE/DELETE/TRUNCATE on it that we cannot revoke (the grantor
    # is supabase_admin — ev-cto decision 0006), so a row-count change means someone used that grant.
    # The baseline and what a move means live in scripts/check-spatial-ref-baseline.mjs.
    #
    # 💰 SCHEDULE ONLY — NOT ON PUSH/PR, and the header above requires stating the price of a new job.
    # This is the cheap kind the header blesses: ~30 billed minutes a month (one nightly run at the
    # one-minute minimum). What it measures is a row count in PROD, which drifts on the CALENDAR, not on
    # our commits — a push cannot change this table — so charging it per push would bill ~494 minutes a
    # month to watch for something pushes never cause. Same reasoning as `child-county` and
    # `season-corpus-floor`.
    #
    # Skips itself GREEN when DATABASE_URL is absent (forks / manual runs with no secret), matching the
    # other live-DB checks — a count of nothing is not a tamper signal.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Read the pin rather than repeating it. CI on 22 while backend/.node-version
          # said 20 is what hid the @supabase/supabase-js WebSocket break until production
          # boot (2026-08-28). The two must not be able to drift again.
          node-version-file: backend/.node-version
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check public.spatial_ref_sys has not been tampered with
        run: npm run check:spatial-ref
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
  stance-audit:
    name: stance-read audit guard
    runs-on: ubuntu-latest
    # 🔴 ITS OWN JOB PER THE RULE AT THE TOP OF THIS FILE: a check that talks to the database does not
    # share a job (a masked tripwire is exactly the 2026-08-14 defect), and it cannot join `static
    # guards` — that job is dependency-free and this one needs `pg`.
    #
    # WHAT IT WATCHES: the stance-read audit required by ADR 0007 §5. That audit is one line of
    # configuration (CC_0116: log_statement=all on `postgres`), so it can be switched off by anyone who
    # can switch it on, and a platform event resetting rolconfig would be silent. It also watches for a
    # NEW role gaining read access to inform.compass_responses — political opinions, GDPR Art. 9
    # special-category data — using effective privilege rather than direct grants, because two roles
    # already read that table through pg_read_all_data with no grant on it at all.
    #
    # 💰 SCHEDULE ONLY — NOT ON PUSH/PR, and the header above requires stating the price of a new job.
    # This is the cheap kind the header blesses: ~30 billed minutes a month (one nightly run at the
    # one-minute minimum). What it measures is role configuration in PROD, which drifts on the CALENDAR,
    # not on our commits — a push cannot change a role setting — so charging it per push would bill
    # ~494 minutes a month to watch for something pushes never cause. Same reasoning as
    # `spatial-ref-baseline` and `child-county`.
    #
    # Skips itself GREEN when DATABASE_URL is absent (forks / manual runs with no secret), matching the
