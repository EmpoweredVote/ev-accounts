# Empowered Vote — Data Coverage Tracker: Utah
#
# SOURCE OF TRUTH for how complete EV's data is per Utah jurisdiction, and the
# jurisdiction-specific research rules the `research-stances` skill must obey.
#
# Two audiences:
#   • Humans  -> rendered as the visual admin page at /admin/coverage
#   • Machines-> `research-stances` reads `rules.skip_topics`; coverage-sync.ts
#                refreshes the `auto` columns from the live DB.
#
# FIELD OWNERSHIP
#   manual (hand-edited here):  expected_seats, geofenced, donors, candidates, status
#   auto   (written by sync):   populated, headshots, stances, last_researched, treasury
# Run `npx tsx scripts/coverage-sync.ts --state ut` after a data load to refresh
# the auto columns. See data/coverage/README.md for the full schema.

state: UT
state_name: Utah
synced_at: 2026-07-29

# ─────────────────────────────────────────────────────────────────────────────
# Universe — the FULL set of jurisdictions in the state, used to show progress
# toward completing the whole state ("10 / 255 cities populated"). Totals and the
# "remaining" list are computed live from essentials.geofence_boundaries (TIGER):
#   counties = G4020, cities/towns = G4110, school districts = G5420.
# Only the state FIPS code and the tribal list (no geofences loaded yet) live here.
# ─────────────────────────────────────────────────────────────────────────────
universe:
  state_fips: "49"
  # Utah's 8 federally recognized tribal nations (no boundary/roster data yet — Wave 3).
  tribes:
    - Confederated Tribes of the Goshute Reservation
    - Navajo Nation
    - Northwestern Band of the Shoshone Nation
    - Paiute Indian Tribe of Utah
    - Skull Valley Band of Goshute
    - Ute Indian Tribe of the Uintah & Ouray Reservation
    - Ute Mountain Ute Tribe
    - San Juan Southern Paiute Tribe

# ─────────────────────────────────────────────────────────────────────────────
# Jurisdiction research rules — MACHINE-READ by research-stances (STEP 0.5).
# A rule removes its topic_key from the topic list for any office level named in
# `applies_to` BEFORE researcher agents are dispatched, and prints a warning.
# ─────────────────────────────────────────────────────────────────────────────
rules:
  skip_topics:
    - topic_key: rent-regulation
      reason: "Utah Code §57-20-1 prohibits municipal rent control statewide, so no UT official can act on rent regulation."
      source: "https://le.utah.gov/xcode/Title57/Chapter20/57-20-S1.html"
      applies_to: [state, county, local, school]
  notes:
    - "School-board races are nonpartisan (already enforced by EV's antipartisan default)."

# ─────────────────────────────────────────────────────────────────────────────
# Coverage rows — one per TRACKED jurisdiction. Add a row when work begins;
# mark not-yet-started jurisdictions `status: deferred`. Do NOT enumerate all
# ~245 UT municipalities. The statewide row is the roll-up (state:ut subtree).
#
# levels:    state | county | local | school
# status:    active | in_progress | deferred
# expected_seats: full-roster target. A jurisdiction is "complete" when active
#            politicians ≥ expected_seats. null = unknown (can't confirm complete).
#            Counties: from ut_county_rosters.json (legislative body + elected
#            executive where the form has one + county-wide officers). Officer counts
#            are PER-COUNTY: Utah Code 17-66-102 enumerates 8 county-wide officers,
#            and 17-66-104 lets each county consolidate them by ordinance, so the real
#            number is 6, 7 or 8 — never a fixed constant. Cache/Davis/Salt Lake/
#            Tooele/Utah verified against county rosters 2026-07-29; the other 24
#            counties still carry the unaudited uniform 7-officer template.
#            Cities & schools: seeded at the current loaded roster (baseline) —
#            VERIFY against official sizes.
# donors/candidates/treasury: none | partial | full
# headshots: none | partial | full   (auto, from photos/total)
# stances:   { researched, total }   (auto; researched = last_stances_researched_at IS NOT NULL)
# ─────────────────────────────────────────────────────────────────────────────
