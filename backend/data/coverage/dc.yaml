# Empowered Vote — Data Coverage Tracker: District of Columbia
# Generated by scripts/coverage-init.ts from the live DB. See data/coverage/README.md.
# expected_seats: chambers = real TIGER seat counts; local bodies = loaded-roster
#   BASELINE (verify against official council/board sizes). null = unknown.
# Fill in rules.skip_topics and universe.tribes by hand as needed.
#
# 🔴 HEAVILY HAND-EDITED — re-init will flatten every `name` and `expected_seats` below.
# DC is neither a state nor a city but is administratively both, so coverage-init's generic
# labels are factually WRONG for it: it emitted "Statewide offices (Gov, U.S. Senate, officers)"
# for a jurisdiction that has no Governor and no U.S. Senators. The Council ward row cannot be
# generated at all (see its comment). If you re-init this file, restore all of it from git.

state: DC
state_name: District of Columbia
synced_at: 2026-07-29

universe:
  state_fips: "11"
  tribes: []   # add federally recognized tribes for this state (no geofences yet)

rules:
  skip_topics: []   # add jurisdiction rules, e.g. topics barred by state law
  notes:
    - "DC's OCD form here is state:dc, NOT the OCD standard's district:dc. That is what the rows
       already in prod use (state:dc/cd:98, state:dc/county:district_of_columbia), and matching the
       data beats matching the spec — a second convention would fragment DC across two subtrees."
    - "THE 8 COUNCIL WARDS ARE INVISIBLE TO ADDRESS SEARCH, and this file cannot show that. Their
       districts carry geo_id 'dc-ward-1'..'dc-ward-8', but the real ward geofences are G5220 rows
       with geo_id 11001..11008. Address search joins geofence_boundaries.geo_id (+ mtfcc) and never
       reads ocd_id, so mapping the ocd_id restored DASHBOARD visibility only. Fixing the geo_id is
       separate work, and note 11001 is ALSO the G4020 county geo_id — so the link must be
       mtfcc-aware, it cannot key on geo_id alone."
    - "Council seats total 13: 8 by ward + 4 at-large + the Chairman. The at-large four, the
       Chairman, the Mayor and the Attorney General all sit on the bare state:dc division because
       they are elected citywide, which is the same treatment STATEWIDE_TYPES get in every state."
    - "The federal row is 3 seats, not 1: Delegate Norton plus TWO U.S. Shadow Senators. TIGER has
       one G5200 district for DC, so coverage-init's seat count read 1 and the row showed 3/1."
    - "The SBOE's 9 members are elected 8-by-ward + 1 at-large but form ONE citywide body, so all 9
       roll up to a single school_district division — the same way IPS, MCCSC and LAUSD board
       sub-districts roll up to their parent LEA."

locations:
  # ── Federal delegation (1) ──
  # HAND-SET name + expected_seats: 3 = Delegate + 2 shadow senators (generator said 1, from TIGER).
  - ocd_id: ocd-division/country:us/state:dc
    ocd_kind: cd
    match: kind
    name: Federal delegation (Delegate + shadow senators)
    level: federal
    status: active
    expected_seats: 3
    geofenced: true
    donors: none
    candidates: none
    treasury: none
    populated: true
    headshots: full
    stances: { researched: 2, total: 3 }
    last_researched: null

  # ── Citywide government (1) ──
  # HAND-SET name: the generated "Statewide offices (Gov, U.S. Senate, officers)" describes offices
  # DC does not have. expected_seats 7 = Mayor + Attorney General + Council Chairman + 4 at-large.
  - ocd_id: ocd-division/country:us/state:dc
    match: exact
    name: Citywide offices (Mayor, AG, Council At-Large)
    level: state
    status: active
    expected_seats: 7
    geofenced: true
    donors: none
    candidates: none
    treasury: none
    populated: true
    headshots: full
    stances: { researched: 6, total: 7 }
    last_researched: null

  # ── Council wards (1) ──
  # 🔴 HAND-AUTHORED, AND coverage-init CANNOT PRODUCE IT. The generator enumerates county:, place:
  # and school_district: kinds; DC's ward seats are state:dc/ward:N — a `ward` directly under the
  # state, with no place above it, because DC has no G4110 place geofence. Without this row the 8
  # ward councilmembers are mapped but counted NOWHERE: the `match: exact` row above matches only
  # the bare state:dc id. Uses the same `match: kind` mechanism as the chamber aggregates.
  - ocd_id: ocd-division/country:us/state:dc
    ocd_kind: ward
    match: kind
    name: Council ward seats
    level: local
    status: active
    expected_seats: 8
    geofenced: false   # districts point at dc-ward-N, not the real G5220 geo_ids — see notes
    donors: none
    candidates: none
    treasury: none
    populated: true
    headshots: full
    stances: { researched: 8, total: 8 }
    last_researched: null

  # ── School districts (1) ──
  # HAND-SET name: this is the elected State Board of Education, not a "District Of Columbia
  # School District" (and the generator's title-casing of the slug produced "Of").
  - ocd_id: ocd-division/country:us/state:dc/school_district:district_of_columbia
    name: State Board of Education (SBOE)
    level: school
    status: active
    expected_seats: 9
    geofenced: true
    donors: none
    candidates: none
    treasury: none
    populated: true
    headshots: full
    stances: { researched: 0, total: 9 }
    last_researched: null
