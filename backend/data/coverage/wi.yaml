rules:
  skip_topics: []   # add jurisdiction rules, e.g. topics barred by state law
  notes:
    - "THE 4 TOWNS ARE NOW MAPPED (2026-07-28): Burlington, Dover, Norway, Waterford, 8 districts /
       14 seated officials, as county:racine/place:<town>. The previous note said they needed a
       G4040/MCD geofence — they ALREADY HAD ONE. backfill-district-ocd.ts only ever queried G4110
       (Place) and so never saw the G4040 County Subdivision name sitting right there. The diagnosis
       was wrong, not the data; resolveMcd() reads G4040 and derives the county from the 10-digit
       geo_id's FIPS-5 prefix."
    - "SLUG COLLISION RESOLVED, and the resolution is load-bearing. WI reuses names across
       municipality types: City of Burlington (place:burlington, geo 5511200) vs Town of Burlington
       (county:racine/place:burlington, geo 5510111225), and Village of Waterford (place:waterford)
       vs Town of Waterford. Stripping the trailing descriptor would collapse each pair into one
       slug and MERGE TWO REAL GOVERNMENTS into a single coverage row. The county: prefix is what
       keeps them apart — it is the same form the IN townships use (county:monroe/place:bean_blossom).
       Do NOT 'simplify' a town to a bare place: slug. Their `name` fields are hand-set to
       'Town of X' for the same reason at the dashboard level."
    - "MADISON CITY HAS ZERO STANCE COVERAGE (0/21), which is easy to misread. Wisconsin's 22
       existing stance rows belong to the Madison/Dane state-legislative DELEGATION — state
       senators and representatives — and are counted under State Senate (2/33) and State House
       (9/99), NOT here. Migration 1480 seeded Madison's city offices and headshots, not stances."
    - "The 26-topic state-office scope is NOT a WI rule and must not be added to skip_topics — it
       comes from inform.compass_topic_roles (role_scope='state') and applies to every state.
       skip_topics is for jurisdiction-specific exclusions, e.g. a topic barred by state law."
    - "State Senate seats: only the 17 ODD-numbered districts are on the 2026 ballot; the even ones
       are mid-term. expected_seats 33 is the full chamber, which is correct for coverage."

