# Empowered Vote — Data Coverage Tracker: Wisconsin
# Generated by scripts/coverage-init.ts from the live DB. See data/coverage/README.md.
# expected_seats: chambers = real TIGER seat counts; local bodies = loaded-roster
#   BASELINE (verify against official council/board sizes). null = unknown.
# Fill in rules.skip_topics and universe.tribes by hand as needed.

state: WI
state_name: Wisconsin
synced_at: 2026-07-28

universe:
  state_fips: "55"
  tribes: []   # add federally recognized tribes for this state (no geofences yet)

rules:
  skip_topics: []   # add jurisdiction rules, e.g. topics barred by state law
  notes:
    - "NO MUNICIPALITIES ARE TRACKABLE YET. Every WI district with district_type LOCAL /
       LOCAL_EXEC has ocd_id = NULL, and every coverage match mode keys on districts.ocd_id
       (geo_id is used only for the treasury join). So coverage-init cannot discover them and a
       hand-written row would match zero districts and report 0/0 — worse than being absent.
       Affected, with seated officials: City of Madison (20 offices, geo_id 5548000, and the only
       WI city with stance coverage — 22 rows via migration 1480), City of Racine (15),
       City of Burlington (8), and ~12 villages/towns in Racine County (6 each).
       FIX: backfill districts.ocd_id for these (e.g. ocd-division/country:us/state:wi/place:madison),
       then re-run coverage-init. Deliberately NOT done as a side effect of creating this file —
       it is a prod write on geography identifiers and the OCD slug convention for WI villages and
       towns (MCDs) is not obviously `place:`, so it deserves its own decision."
    - "The 26-topic state-office scope is NOT a WI rule and must not be added to skip_topics — it
       comes from inform.compass_topic_roles (role_scope='state') and applies to every state.
       skip_topics is for jurisdiction-specific exclusions, e.g. a topic barred by state law."
    - "State Senate seats: only the 17 ODD-numbered districts are on the 2026 ballot; the even ones
       are mid-term. expected_seats 33 is the full chamber, which is correct for coverage."

