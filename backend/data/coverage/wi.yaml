# Fill in rules.skip_topics and universe.tribes by hand as needed.

state: WI
state_name: Wisconsin
synced_at: 2026-07-28

universe:
  state_fips: "55"
  tribes: []   # add federally recognized tribes for this state (no geofences yet)

rules:
  skip_topics: []   # add jurisdiction rules, e.g. topics barred by state law
  notes:
    - "4 TOWNS ARE STILL UNMAPPED and so absent from this file: Town of Burlington, Town of Dover,
       Town of Norway, Town of Waterford (8 districts, 12 seated officials). They are MCDs with
       10-digit geo_ids and NO G4110 place geofence, so backfill-district-ocd.ts has no name to
       derive a slug from and skips them. Not fixable by that script; they need a G4040/MCD
       geofence or a hand-mapped ocd_id."
    - "SLUG COLLISION RISK if those towns are ever mapped. We strip TIGER's trailing descriptor
       (city/town/village/borough/CDP) so slugs match the ~296 already-populated rows, which are
       clean (place:holladay, place:san_diego). But WI reuses names across municipality types:
       City of Burlington vs Town of Burlington, and Village of Waterford vs Town of Waterford
       would both collapse to place:burlington / place:waterford. The descriptor is exactly what
       disambiguates them, and we discard it. No collision exists today — only cities and villages
       are mapped and those 14 slugs are distinct — but do not map the towns without resolving it."
    - "MADISON CITY HAS ZERO STANCE COVERAGE (0/21), which is easy to misread. Wisconsin's 22
       existing stance rows belong to the Madison/Dane state-legislative DELEGATION — state
       senators and representatives — and are counted under State Senate (2/33) and State House
       (9/99), NOT here. Migration 1480 seeded Madison's city offices and headshots, not stances."
    - "The 26-topic state-office scope is NOT a WI rule and must not be added to skip_topics — it
       comes from inform.compass_topic_roles (role_scope='state') and applies to every state.
       skip_topics is for jurisdiction-specific exclusions, e.g. a topic barred by state law."
    - "State Senate seats: only the 17 ODD-numbered districts are on the 2026 ballot; the even ones
       are mid-term. expected_seats 33 is the full chamber, which is correct for coverage."

