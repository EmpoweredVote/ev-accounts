# Supabase project configuration
# Run `supabase link --project-ref <ref>` to connect to your Supabase project.
# Obtain <ref> from your Supabase dashboard: Settings > General > Reference ID.

[api]
enabled = true
port = 54321
schemas = ["public", "connect", "empower", "inform"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
# JWT expiry in seconds (default: 3600 = 1 hour)
jwt_expiry = 3600
# Disable email confirmations for local dev (enable in prod)
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
