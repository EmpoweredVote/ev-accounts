services:
  - type: web
    name: empowered-vote-app
    runtime: static
    buildCommand: cd app && npm install && npm run build
    staticPublishPath: ./app/dist
    envVars:
      - key: VITE_API_URL
        value: https://accounts.empowered.vote
      - key: NODE_VERSION
        value: "20"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
